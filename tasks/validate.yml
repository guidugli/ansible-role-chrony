---
- name: Validate public role arguments
  ansible.builtin.validate_argument_spec:
    argument_spec: >-
      {{ (lookup('file', role_path + '/meta/argument_specs.yml')
         | from_yaml).argument_specs.main.options }}
  tags:
    - chrony
    - validate

- name: Require at least one Chrony time source
  ansible.builtin.assert:
    that:
      - chrony_servers | length > 0 or chrony_pools | length > 0
    fail_msg: Set a non-empty chrony_servers or chrony_pools list.
    quiet: true
  tags:
    - chrony
    - validate

- name: Validate Chrony makestep syntax
  ansible.builtin.assert:
    that:
      - chrony_makestep is regex('^[0-9]+(?:\.[0-9]+)?[ ]+-?[0-9]+$')
    fail_msg: chrony_makestep must contain a threshold and limit, for example '1.0 3'.
    quiet: true
  tags:
    - chrony
    - validate

- name: Validate Chrony path variables
  vars:
    chrony_path_pattern: '^/(?:[^/]+/?)*$'
  ansible.builtin.assert:
    that:
      - item.value is regex(chrony_path_pattern)
    fail_msg: "{{ item.name }} must be an absolute path."
    quiet: true
  loop:
    - name: chrony_dhcp_sourcedir
      value: "{{ chrony_dhcp_sourcedir }}"
    - name: chrony_driftfile
      value: "{{ chrony_driftfile }}"
    - name: chrony_keyfile
      value: "{{ chrony_keyfile }}"
    - name: chrony_logdir
      value: "{{ chrony_logdir }}"
    - name: chrony_ntsdumpdir
      value: "{{ chrony_ntsdumpdir }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - chrony
    - validate
