---
chrony_service: chronyd
chrony_distribution: "{{ ansible_facts['distribution'] | default('default') }}"
chrony_distribution_major: "{{ ansible_facts['distribution_major_version'] | default('') }}"
chrony_distribution_key: >-
  {{ chrony_distribution ~ '-' ~ chrony_distribution_major
     if chrony_distribution_major | length > 0 else chrony_distribution }}
chrony_package_map:
  default:
    - chrony
chrony_packages: >-
  {{ chrony_package_map[chrony_distribution_key]
     | default(chrony_package_map[chrony_distribution])
     | default(chrony_package_map['default']) }}
chrony_etc_path_map:
  default: /etc/chrony
  RedHat: /etc
  Fedora: /etc
  CentOS: /etc
  Rocky: /etc
chrony_etc_path: >-
  {{ chrony_etc_path_map[chrony_distribution_key]
     | default(chrony_etc_path_map[chrony_distribution])
     | default(chrony_etc_path_map['default']) }}
chrony_cfg_mode: "0644"
chrony_container_types:
  - container
  - containerd
  - docker
  - lxc
  - podman
